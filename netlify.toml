# Publicação no Netlify: páginas estáticas em public/ e a API em netlify/functions/api.mjs.
# Variáveis obrigatórias no Netlify (Project configuration → Environment variables):
#   ADMIN_PASSWORD e QR_SECRET (não troque depois de imprimir os QR Codes)
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/consulta"
  to = "/consulta.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"
